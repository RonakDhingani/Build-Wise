name: build_wise
description: "BuildWise — Construction project budget and progress tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Image handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Charts & analytics
  syncfusion_flutter_charts: ^31.1.17

  # PDF generation & sharing
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1

  # Onboarding walkthrough / product tour
  tutorial_coach_mark: ^1.2.11

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
