name: build_wise
description: "BuildWise — Construction project budget and progress tracker."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Image handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Charts & analytics
  syncfusion_flutter_charts: ^31.1.17

  # PDF generation & sharing
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4

  # Backup / export & import (offline)
  archive: ^3.6.1
  file_picker: ^8.1.6
  permission_handler: ^11.3.1

  # In-app web view (legal & support pages)
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1

  # Onboarding walkthrough / product tour
  tutorial_coach_mark: ^1.2.11

  # firebase
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_remote_config: ^6.0.1
  firebase_analytics: ^12.0.1
  package_info_plus: ^8.1.0
  device_info_plus: ^11.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
